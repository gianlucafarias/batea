<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batea</title>
    <!-- Pantalla de arranque: se ve al instante, antes de que cargue el resto (React la reemplaza; mismo diseño que <Splash/>) -->
    <style>
      html, body { margin: 0; height: 100%; background: #0e0d0c; }
      .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0e0d0c; color: #ece6dc; font-family: 'Archivo Variable', -apple-system, system-ui, sans-serif; }
      .splash-in { display: grid; justify-items: center; text-align: center; padding: 0 24px; }
      .splash-mark svg { width: 56px; height: 56px; display: block; animation: splash-bob 2.6s ease-in-out infinite; }
      .splash-name { margin-top: 14px; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; font-stretch: 112%; }
      .splash-bar { width: 150px; height: 3px; margin-top: 26px; border-radius: 2px; background: #2b2724; overflow: hidden; }
      .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #ff5a1f; animation: splash-slide 1.2s ease-in-out infinite; }
      .splash-sub { margin: 12px 0 18px; max-width: 340px; font-size: 12.5px; line-height: 1.5; color: #8a8278; }
      .splash-msg { margin: 22px 0 0; font-size: 14px; font-weight: 600; }
      @keyframes splash-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes splash-bob { 50% { transform: translateY(-3px) rotate(-2deg); } }
      @media (prefers-reduced-motion: reduce) { .splash-mark svg, .splash-bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-in">
          <div class="splash-mark">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <rect x="3" y="15" width="26" height="14" rx="2.5" fill="#2b2622" stroke="#4a423a" />
              <rect x="7" y="5" width="18" height="16" rx="1.5" fill="#ff5a1f" transform="rotate(-6 16 13)" />
              <circle cx="16" cy="12.6" r="4.2" fill="#0e0d0c" transform="rotate(-6 16 13)" />
              <circle cx="16" cy="12.6" r="1.1" fill="#ff5a1f" />
              <rect x="12" y="19" width="8" height="2.4" rx="1.2" fill="#0e0d0c" />
            </svg>
          </div>
          <div class="splash-name">batea</div>
          <div class="splash-bar"><i></i></div>
          <p class="splash-sub">Abriendo tu librería…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
