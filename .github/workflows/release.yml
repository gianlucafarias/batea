# Arma los dos instaladores de Batea (Apple Silicon e Intel) en Macs de GitHub, firmados y notarizados,
# con el mismo scripts/make_dist.sh que se usa en local. Cada arquitectura se arma en su propia máquina,
# así el instalador Intel se arma y se prueba (--selftest) en un Intel real, sin Rosetta.
#
# Se lanza a mano: Actions → «Armar instaladores» → Run workflow.
#   - publicar = no  → solo deja los .dmg como artefactos de la ejecución (para probar).
#   - publicar = sí  → además crea el release v<VERSION> como BORRADOR con los dos .dmg.
# update.json (lo que leen las apps instaladas) NO se toca acá: se sube después de revisar el release.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12           certificado «Developer ID Application» + clave privada, exportado como .p12, en base64
#   MACOS_CERT_PASSWORD      contraseña de ese .p12
#   Notarización, una de las dos formas:
#     NOTARY_KEY_P8 (base64), NOTARY_KEY_ID, NOTARY_ISSUER_ID   ← API key de App Store Connect
#     NOTARY_APPLE_ID, NOTARY_APP_PASSWORD                      ← Apple ID + contraseña de app

name: Armar instaladores

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Crear el release como borrador con los dos .dmg"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Batea ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # Apple Silicon; arm64 pide macOS 15 por el wheel de Essentia
          - arch: x86_64
            runner: macos-15-intel    # Intel nativo
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SIGN_ID: "Developer ID Application: Gianluca Palmier (J96S7CUHS9)"
      NOTARY_PROFILE: batea-notary
      TEAM_ID: J96S7CUHS9
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias de la interfaz
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Llavero temporal con el certificado de firma
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [[ -n "$P12" && -n "$P12_PASSWORD" ]] || { echo "::error::Faltan los secretos MACOS_CERT_P12 / MACOS_CERT_PASSWORD"; exit 1; }
          KC="$RUNNER_TEMP/batea.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "$SIGN_ID" || { echo "::error::El .p12 no trae «$SIGN_ID»"; exit 1; }
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Credenciales de notarización
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [[ -n "$KEY_P8" ]]; then
            echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$KEY_ID" --issuer "$ISSUER_ID" --keychain "$KEYCHAIN"
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [[ -n "$APPLE_ID" ]]; then
            xcrun notarytool store-credentials "$NOTARY_PROFILE" --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" --password "$APP_PASSWORD" --keychain "$KEYCHAIN"
          else
            echo "::error::Faltan las credenciales de notarización (NOTARY_KEY_* o NOTARY_APPLE_ID)"; exit 1
          fi

      - name: Armar, probar, firmar y notarizar
        run: ./scripts/make_dist.sh ${{ matrix.arch }}

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: batea-${{ matrix.arch }}
          path: |
            release/Batea-*-${{ matrix.arch }}.dmg
            release/Batea-*-${{ matrix.arch }}.build.json
          if-no-files-found: error
          retention-days: 14

      - name: Registro de PyInstaller y selftest (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.arch }}
          path: |
            build/${{ matrix.arch }}/pyinstaller.log
            build/${{ matrix.arch }}/selftest.log
          if-no-files-found: ignore

      - name: Borrar el llavero temporal
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/batea.keychain-db" 2>/dev/null || true

  release:
    name: Release borrador
    needs: build
    if: ${{ inputs.publicar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear el release v<VERSION> como borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          ls -la dist
          # notas = la sección de esta versión en CHANGELOG.md
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "v$V" dist/Batea-"$V"-arm64.dmg dist/Batea-"$V"-x86_64.dmg \
            --draft --target "$GITHUB_SHA" --title "Batea $V" --notes-file notes.md
